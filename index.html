<script type="text/babel">

const COLORS = ['#a78bfa','#34d399','#60a5fa','#f472b6','#fb923c','#a3e635','#38bdf8','#c084fc'];

const REACTIONS = [
  {key:'heart',emoji:'❤️',label:'좋아요'},
  {key:'cheer',emoji:'💪',label:'힘내요'},
  {key:'same',emoji:'🤝',label:'같은 마음'},
  {key:'support',emoji:'🫂',label:'응원해요'},
  {key:'metoo',emoji:'🙋',label:'나도 그랬어요'},
];
const MUSIC_DB = {
  슬픔:[{song:'봄날',artist:'BTS',emoji:'🎹'},{song:'Sad Eyes',artist:'Coldplay',emoji:'🎸'},{song:'빗소리',artist:'혁오',emoji:'🎵'}],
  외로움:[{song:'밤편지',artist:'아이유',emoji:'🌙'},{song:'오랜 날 오랜 밤',artist:'악동뮤지션',emoji:'⭐'},{song:'홀로',artist:'Zion.T',emoji:'🎹'}],
  불안:[{song:'Fix You',artist:'Coldplay',emoji:'💙'},{song:'Breathe',artist:'이창섭',emoji:'🌿'},{song:'다 잘 될 거야',artist:'멜로망스',emoji:'🌤'}],
  화남:[{song:'Lose Yourself',artist:'Eminem',emoji:'🔥'},{song:'화',artist:'기리보이',emoji:'💢'},{song:'거짓말',artist:'BIGBANG',emoji:'⚡'}],
  지침:[{song:'자라',artist:'아이유',emoji:'🌙'},{song:'Tired',artist:'Bazzi',emoji:'😴'},{song:'쉬어요',artist:'폴킴',emoji:'☁️'}],
  설렘:[{song:'좋은 날',artist:'아이유',emoji:'🌸'},{song:'Happy',artist:'Pharrell',emoji:'🌈'},{song:'Dynamite',artist:'BTS',emoji:'✨'}],
  감사:[{song:'Beautiful',artist:'Crush',emoji:'💛'},{song:'고마워',artist:'거미',emoji:'🙏'},{song:'사랑에 빠지고 싶다',artist:'폴킴',emoji:'🌺'}],
  그냥:[{song:'에잇',artist:'아이유',emoji:'🎵'},{song:'lofi hip hop',artist:'ChillHop',emoji:'☕'},{song:'Daylight',artist:'Taylor Swift',emoji:'🌅'}],
};

function anonName(id) {
  const s=String(id).replace(/-/g,'');
  const h=[...s].reduce((a,c)=>a+c.charCodeAt(0),0);
  const adj=['조용한','따뜻한','작은','맑은','깊은','서툰','솔직한','은은한'];
  const n=['달','별','구름','바람','새벽','안개','빗소리','파도'];
  return adj[h%adj.length]+' '+n[Math.floor(h/7)%n.length];
}
function anonColor(id) {
  const h=[...String(id).replace(/-/g,'')].reduce((a,c)=>a+c.charCodeAt(0),0);
  return COLORS[h%COLORS.length];
}
function timeAgo(ts) {
  const d=Date.now()-new Date(ts).getTime();
  if(d<60000) return '방금 전';
  if(d<3600000) return Math.floor(d/60000)+'분 전';
  if(d<86400000) return Math.floor(d/3600000)+'시간 전';
  return Math.floor(d/86400000)+'일 전';
}
function fmtFull(ts) {
  const d=new Date(ts);
  return d.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'})+' '+d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
}
function totalR(r) { return Object.values(r||{}).reduce((a,b)=>a+b,0); }
function isMyPost(post) { return post.session_id === SESSION_ID; }

async function fetchPosts() {
  const {data:posts}=await sb.from('posts').select('*').order('created_at',{ascending:false}).limit(50);
  if(!posts) return [];
  const {data:reactions}=await sb.from('reactions').select('*');
  const {data:comments}=await sb.from('comments').select('*');
  return posts.map(p=>{
    const pr=(reactions||[]).filter(r=>r.post_id===p.id);
    const rc={heart:0,cheer:0,same:0,support:0,metoo:0};
    pr.forEach(r=>{ if(rc[r.reaction_type]!==undefined) rc[r.reaction_type]++; });
    const myR=pr.find(r=>r.session_id===SESSION_ID);
    return {...p,reactions:rc,myReaction:myR?myR.reaction_type:null,comments:(comments||[]).filter(c=>c.post_id===p.id)};
  });
}

function Toast({msg,visible}) { return <div className={`toast ${visible?'show':''}`}>{msg}</div>; }

function MusicModal({emotion,open,onClose}) {
  const [playing,setPlaying]=useState(null);
  const list=MUSIC_DB[emotion]||MUSIC_DB['그냥'];
  return (
    <div className={`music-modal ${open?'open':''}`}>
      <div className="music-header">
        <div><div className="music-title">🎵 기운 내라고 노래 추천해줄게요</div><div className="music-sub">{EMOTION_ICONS[emotion]} {emotion} 감정에 어울리는 플레이리스트</div></div>
        <button className="music-close" onClick={onClose}>✕</button>

function App() {
  const [page,setPage]=useState('feed');
  const [posts,setPosts]=useState([]);
  const [loading,setLoading]=useState(true);
  const [submitting,setSubmitting]=useState(false);
  const [detail,setDetail]=useState(null);
  const [donateOpen,setDonateOpen]=useState(false);
  const [inquiryOpen,setInquiryOpen]=useState(false);
  const [reportTarget,setReportTarget]=useState(null);
  const [editTarget,setEditTarget]=useState(null);
  const [historyTarget,setHistoryTarget]=useState(null);
  const [toast,setToast]=useState({msg:'',visible:false});
  const [popularTab,setPopularTab]=useState('24h');
  const toastTimer=useRef(null);

  const showToast=useCallback(msg=>{
    setToast({msg,visible:true});
    clearTimeout(toastTimer.current);
    toastTimer.current=setTimeout(()=>setToast(t=>({...t,visible:false})),2500);
  },[]);

  const loadData=useCallback(async()=>{
    setLoading(true);
    setPosts(await fetchPosts());
    setLoading(false);
  },[]);

  useEffect(()=>{ loadData(); },[]);

  useEffect(()=>{
    const g=document.getElementById('screenshot-guard');
    const onKey=e=>{
      if(e.key==='PrintScreen'||(e.metaKey&&e.shiftKey&&['3','4','5'].includes(e.key))||(e.ctrlKey&&e.key==='p')){
        e.preventDefault(); g.classList.add('active'); setTimeout(()=>g.classList.remove('active'),2000);
      }
    };
    document.addEventListener('keydown',onKey);
    document.addEventListener('contextmenu',e=>e.preventDefault());
    return()=>{ document.removeEventListener('keydown',onKey); };
  },[]);

  const updatePost=(id,changes)=>{
    setPosts(prev=>prev.map(p=>p.id===id?{...p,...changes}:p));
    setDetail(d=>d&&d.id===id?{...d,...changes}:d);
  };

  async function handleReact(postId,key,currentReaction) {
    const rc=posts.find(p=>p.id===postId)?.reactions||{};
    const newR={...rc};
    if(currentReaction) newR[currentReaction]--;
    if(currentReaction!==key) newR[key]++;
    updatePost(postId,{reactions:newR,myReaction:currentReaction===key?null:key});
    if(currentReaction===key) {
      await sb.from('reactions').delete().match({post_id:postId,session_id:SESSION_ID});
      showToast('리액션을 취소했어요');
    } else {
      await sb.from('reactions').upsert({post_id:postId,session_id:SESSION_ID,reaction_type:key},{onConflict:'post_id,session_id'});
      showToast(REACTIONS.find(r=>r.key===key).emoji+' 리액션을 남겼어요');
    }
  }

  async function handleSubmit(text,emotion) {
    setSubmitting(true);
    const {data}=await sb.from('posts').insert({emotion,text,session_id:SESSION_ID}).select().single();
    if(data){
      setPosts(prev=>[{...data,reactions:{heart:0,cheer:0,same:0,support:0,metoo:0},myReaction:null,comments:[]},...prev]);
      setPage('feed');
      showToast('✨ 일기가 익명으로 올라갔어요');
    }
    setSubmitting(false);
  }

  async function handleAddComment(postId,text) {
    const {data}=await sb.from('comments').insert({post_id:postId,text}).select().single();
    if(data){
      setPosts(prev=>prev.map(p=>p.id===postId?{...p,comments:[...p.comments,data]}:p));
      if(detail?.id===postId) setDetail(d=>({...d,comments:[...d.comments,data]}));
      showToast('💬 댓글을 남겼어요');
    }
  }

  async function handleReport(postId,reason) {
    await sb.from('reports').insert({post_id:postId,reason});
    setPosts(prev=>prev.filter(p=>p.id!==postId));
    if(detail?.id===postId) setDetail(null);
    setReportTarget(null);
    showToast('🚩 신고가 접수됐어요');
  }

  async function handleEdit(postId,oldText,newText) {
    // 수정 전 내용을 히스토리에 저장
    await sb.from('post_edits').insert({post_id:postId,old_text:oldText});
    const now=new Date().toISOString();
    await sb.from('posts').update({text:newText,updated_at:now}).eq('id',postId);
    updatePost(postId,{text:newText,updated_at:now});
    setEditTarget(null);
    showToast('✏️ 수정됐어요');
  }

  async function handleDelete(postId) {
    if(!confirm('내 일기를 삭제할까요? 되돌릴 수 없어요.')) return;
    await sb.from('posts').delete().eq('id',postId);
    setPosts(prev=>prev.filter(p=>p.id!==postId));
    if(detail?.id===postId) setDetail(null);
    showToast('🗑️ 일기가 삭제됐어요');
  }

  const popularPosts=[...posts].sort((a,b)=>{
    if(popularTab==='24h'){const aN=new Date(a.created_at)>new Date(Date.now()-86400000);const bN=new Date(b.created_at)>new Date(Date.now()-86400000);if(aN!==bN) return bN-aN;}
    else if(popularTab==='7d'){const aN=new Date(a.created_at)>new Date(Date.now()-604800000);const bN=new Date(b.created_at)>new Date(Date.now()-604800000);if(aN!==bN) return bN-aN;}
    return totalR(b.reactions)-totalR(a.reactions);
  });

  const cardProps=(post)=>({
    post,
    onClick:()=>setDetail(post),
    onReact:handleReact,
    onDonate:()=>setDonateOpen(true),
    onReport:id=>setReportTarget(id),
    onEdit:p=>setEditTarget(p),
    onDelete:handleDelete,
    onHistory:id=>setHistoryTarget(id),
  });

  return (
    <>
      <nav className="nav">
        <div className="nav-logo">Dear <span>Nobody</span></div>
        <div className="nav-tabs">
          <button className={`nav-tab ${page==='feed'?'active':''}`} onClick={()=>setPage('feed')}>피드</button>
          <button className={`nav-tab ${page==='popular'?'active':''}`} onClick={()=>setPage('popular')}>인기</button>
        </div>
        <button className="nav-write" onClick={()=>setPage('write')}>✏️ 쓰기</button>
      </nav>
      <div className="main">
        {page==='feed'&&<>
          <div className="feed-header"><div className="feed-title">모두의 일기 🌙</div><div className="feed-sub">익명의 누군가가 오늘의 감정을 기록했어요</div></div>
          {loading?<div className="loading"><div className="spinner"/><span>불러오는 중...</span></div>
          :posts.length===0?<div className="empty-state"><div style={{fontSize:40,marginBottom:12}}>📖</div><p>아직 일기가 없어요. 첫 번째로 써볼까요?</p></div>
          :posts.map(p=><DiaryCard key={p.id} {...cardProps(p)}/>)}
        </>}
        {page==='popular'&&<>
          <div className="feed-header"><div className="feed-title">인기 일기 🔥</div><div className="feed-sub">가장 많은 공감을 받은 이야기들</div></div>
          <div className="tab-bar">
            {[['24h','오늘'],['7d','이번 주'],['all','전체']].map(([k,l])=>(
              <button key={k} className={`tab-btn ${popularTab===k?'active':''}`} onClick={()=>setPopularTab(k)}>{l}</button>
            ))}
          </div>
          {popularPosts.map((p,i)=><DiaryCard key={p.id} {...cardProps(p)} rank={i+1}/>)}
        </>}
        {page==='write'&&<WritePage onSubmit={handleSubmit} loading={submitting}/>}
      </div>
      {detail&&<DetailModal post={detail} onClose={()=>setDetail(null)} onReact={handleReact} onDonate={()=>setDonateOpen(true)} onReport={id=>setReportTarget(id)} onEdit={p=>setEditTarget(p)} onDelete={handleDelete} onAddComment={handleAddComment} onHistory={id=>setHistoryTarget(id)}/>}
      {donateOpen&&<DonateModal onClose={()=>setDonateOpen(false)}/>}
      {reportTarget&&<ReportModal onClose={()=>setReportTarget(null)} onSubmit={reason=>handleReport(reportTarget,reason)}/>}
      {editTarget&&<EditModal post={editTarget} onClose={()=>setEditTarget(null)} onSave={handleEdit}/>}
      {historyTarget&&<HistoryModal postId={historyTarget} onClose={()=>setHistoryTarget(null)}/>}
      {inquiryOpen&&<InquiryModal onClose={()=>setInquiryOpen(false)}/>}
      <Toast msg={toast.msg} visible={toast.visible}/>
      <div className="footer-bar">
        <button className="inquiry-trigger" onClick={()=>setInquiryOpen(true)}>💡 기능 추가 문의하기</button>
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
